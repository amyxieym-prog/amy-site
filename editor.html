<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><title>Amy 网站内容工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#173f35;font-family:'Microsoft YaHei',system-ui;line-height:1.8}main{max-width:1100px;margin:auto;padding:35px 24px}h1{font-size:30px;font-weight:400}p{color:#6d766d;font-size:13px}.notice{padding:20px;background:#e8ebde;border-left:3px solid #9cab83}button,.file-label{padding:10px 20px;border:1px solid #9fac8f;background:#173f35;color:#f7f5ef;font:13px inherit;cursor:pointer;display:inline-block}button.secondary,.file-label{background:transparent;color:#173f35}nav{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}label{display:block;font-size:13px;margin:15px 0 7px}input,textarea,select{width:100%;padding:11px;background:white;border:1px solid #ccd2c0;color:#173f35;font:14px/1.7 inherit}textarea{min-height:480px;font-family:Consolas,monospace;font-size:12px}fieldset{border:1px solid #ccd2c0;padding:20px;margin:24px 0}legend{font-size:16px}#message{white-space:pre-wrap;font-size:13px;padding:16px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 25px}a{color:inherit}input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #b99a62;outline-offset:3px}@media(max-width:600px){.fields{grid-template-columns:1fr}textarea{font-size:11px}}
</style><script type="module" src="editor.js"></script></head><body><main><a href="./">← 返回网站预览</a><h1>Amy 网站内容工作台</h1><p class="notice">这是本地内容编辑器。修改和草稿保存在当前浏览器，不会直接发布到网站。导出后替换 content/site.json，检查并推送 GitHub，网站才会更新。工作台不进入公开网站部署。</p><nav><button id="load-current" class="secondary">读取项目内容</button><button id="load-draft" class="secondary">恢复本地草稿</button><label class="file-label" style="margin:0">导入内容文件<input id="import-file" type="file" accept="application/json,.json" style="display:none"></label><button id="save-draft" class="secondary">保存本地草稿</button><button id="export">检查并导出</button></nav><div id="message" role="status" aria-live="polite"></div><fieldset><legend>联系方式与更新时间</legend><div class="fields"><div><label for="wechat">公开微信号</label><input id="wechat"></div><div><label for="booking">预约链接（可留空）</label><input id="booking" type="url"></div><div><label for="updated">信息更新日期</label><input id="updated" type="date"></div></div><button id="apply-contact" class="secondary" style="margin-top:20px">写入内容</button></fieldset><fieldset><legend>添加一项真实课程安排</legend><p>时间按北京时间录入；只添加已确认的信息。已结束课程会自动退出近期安排。</p><div class="fields"><div><label for="course-title">课程标题</label><input id="course-title"></div><div><label for="course-id">唯一编号（字母、数字或短横线）</label><input id="course-id" placeholder="rise-parent-202610"></div><div><label for="audience">适合对象</label><input id="audience"></div><div><label for="format">形式</label><input id="format" placeholder="线上 / 线下"></div><div><label for="start">开始时间</label><input id="start" type="datetime-local"></div><div><label for="end">结束时间</label><input id="end" type="datetime-local"></div><div><label for="deadline">报名截止（可留空）</label><input id="deadline" type="datetime-local"></div><div><label for="status">状态</label><select id="status"><option value="upcoming">即将开放</option><option value="open">报名中</option><option value="closed">报名截止</option><option value="ongoing">进行中</option><option value="ended">已结束</option><option value="evergreen">长期可学</option></select></div><div><label for="registration">正式报名链接（可留空）</label><input id="registration" type="url"></div><div><label for="description">简介与必要费用说明</label><input id="description"></div></div><button id="add-course" class="secondary" style="margin-top:20px">添加到内容</button></fieldset><label for="json">完整内容（案例、文章、课程均可在此修改；删除课程时删除 courses 内对应对象）</label><textarea id="json" spellcheck="false"></textarea></main></body></html>
